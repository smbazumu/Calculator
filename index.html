<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="calc">
      <div class="top">
        <h4>calc</h4>
        <div class="toggles">
          <div class="labels">
            <label for="one">1</label>
            <label for="two">2</label>
            <label for="three">3</label>
          </div>
          <div class="toggle">
            <input type="radio" name="toggle" id="one" checked>
            <input type="radio" name="toggle" id="two">
            <input type="radio" name="toggle" id="three">
            <div class="track">
              <div class="knob"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="middle">
        <input type="text" name="" id="input">
      </div>
      <div class="bottom">
        <div class="bottom1">
          <button class="btns special" onclick="deleteEverything()">RESET</button>
          <button class="btns" onclick="calcPercent()">%</button>
          <button class="btns" onclick="chooseOp('MOD')">MOD</button>
          <button class="btns" onclick="chooseOp('/')">/</button>
          <button class="btns" onclick="addNum('7')">7</button>
          <button class="btns" onclick="addNum('8')">8</button>
          <button class="btns" onclick="addNum('9')">9</button>
          <button class="btns" onclick="chooseOp('-')">-</button>
          <button class="btns" onclick="addNum('4')">4</button>
          <button class="btns" onclick="addNum('5')">5</button>
          <button class="btns" onclick="addNum('6')">6</button>
          <button class="btns" onclick="chooseOp('*')">x</button>
          <button class="btns" onclick="addNum('1')">1</button>
          <button class="btns" onclick="addNum('2')">2</button>
          <button class="btns" onclick="addNum('3')">3</button>
          <button class="btns" onclick="chooseOp('+')">+</button>
        </div>
        <div class="bottom2">
          <button class="btns" onclick="addNum('0')">0</button>
          <button class="btns" onclick="addComma()">.</button>
          <button class="btns special" onclick="deleteNum()">DEL</button>
          <button class="btns special specialT" onclick="result()">=</button>
        </div>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
  <script src="index.js"></script>
</body>

</html>
